<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE enforcement and childcare employment, by setting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ffffff; }
  body {
    font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #0f172a;
    padding: 20px 18px 16px;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .es-wrap { position: relative; max-width: 720px; margin: 0 auto; }
  .es-title {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 20px; font-weight: 500; color: #0f172a;
    line-height: 1.3; margin-bottom: 16px;
    letter-spacing: -0.005em;
  }
  .es-legend { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-bottom: 14px; }
  .es-legend-item {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 4px 0;
    font-family: inherit; font-size: 13px;
    cursor: pointer; color: #64748b;
    border-bottom: 1.5px solid transparent;
    transition: color 0.12s, border-color 0.12s;
  }
  .es-legend-item:hover { color: #0f172a; border-bottom-color: #cbd5e1; }
  .es-legend-item.active {
    color: var(--c);
    font-weight: 500;
  }
  .es-rule {
    display: inline-block; width: 20px; height: 2px;
    background: var(--c); flex-shrink: 0;
  }
  .es-legend-cell {
    display: inline-flex; align-items: center; gap: 1px;
  }
  .es-info-btn {
    background: none; border: none; padding: 4px 4px;
    margin-left: -2px; cursor: pointer;
    color: #94a3b8; line-height: 0;
    border-radius: 2px;
    transition: color 0.12s;
  }
  .es-info-btn:hover, .es-info-btn[aria-expanded="true"] { color: #475569; }
  .es-info-btn:focus-visible { outline: 2px solid #00356B; outline-offset: 1px; }
  .es-def-popover {
    position: absolute; z-index: 20;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-left: 3px solid var(--def-color, #cbd5e1);
    border-radius: 2px;
    padding: 8px 10px;
    font-size: 12.5px; line-height: 1.5;
    color: #475569;
    max-width: 260px; min-width: 200px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    pointer-events: none;
  }
  .es-def-popover-title {
    font-weight: 500; color: var(--def-color, #0f172a);
    margin-bottom: 2px; font-size: 12.5px;
  }
  .es-svg-box { position: relative; width: 100%; }
  .es-svg-box svg { width: 100%; height: auto; display: block; overflow: visible; }
  .es-tip {
    position: absolute; pointer-events: none;
    background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px;
    padding: 7px 9px; font-size: 12px; line-height: 1.45;
    opacity: 0; transition: opacity 0.1s; z-index: 10; min-width: 170px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
  }
  .es-tip-title { font-weight: 500; margin-bottom: 4px; color: #0f172a; }
  .es-tip-row { color: #475569; font-variant-numeric: tabular-nums; }
  .es-tip-multi {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 1px 0;
    font-size: 12px;
    line-height: 1.4;
  }
  .es-tip-swatch { width: 12px; height: 2px; border-radius: 1px; }
  .es-tip-name { font-weight: 500; }
  .es-tip-num { font-variant-numeric: tabular-nums; color: #475569; }
  .es-dot { cursor: pointer; }
  .es-readout {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: #f8fafc;
    border-left: 3px solid var(--readout-color, #cbd5e1);
    border-radius: 2px;
    font-size: 13px; line-height: 1.5;
    color: #475569;
    min-height: 48px;
  }
  .es-readout-title { font-weight: 500; color: #0f172a; margin-bottom: 2px; }
  .es-readout-value { font-variant-numeric: tabular-nums; }
  .es-readout-placeholder { color: #94a3b8; font-style: italic; }
  @media (hover: none) {
    .es-tip { display: none !important; }
    .es-readout { display: block; }
  }
  @media (max-width: 500px) {
    body { padding: 14px 12px; font-size: 13px; }
    .es-title { font-size: 17px; }
    .es-legend-item { font-size: 12px; }
  }
</style>
</head>
<body>

<h1 class="sr-only">Event-study: ICE enforcement and foreign-born women's childcare employment, by setting</h1>

<div class="es-wrap">
  <div class="es-title">Change in foreign-born childcare employment, by setting</div>

  <div class="es-legend" role="group" aria-label="Select a childcare setting to highlight">
    <span class="es-legend-cell">
      <button class="es-legend-item" data-key="any_cc2" style="--c: #6F6F73"><span class="es-rule"></span>Any Childcare</button>
      <button class="es-info-btn" type="button" aria-label="About Any Childcare" data-def-key="any_cc2"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/><rect x="7.3" y="6.8" width="1.4" height="5.4" rx="0.6" fill="currentColor"/></svg></button>
    </span>
    <span class="es-legend-cell">
      <button class="es-legend-item active" data-key="center_cc" style="--c: #00356B"><span class="es-rule"></span>Center-Based Care</button>
      <button class="es-info-btn" type="button" aria-label="About Center-Based Care" data-def-key="center_cc"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/><rect x="7.3" y="6.8" width="1.4" height="5.4" rx="0.6" fill="currentColor"/></svg></button>
    </span>
    <span class="es-legend-cell">
      <button class="es-legend-item" data-key="home_cc" style="--c: #B58A2E"><span class="es-rule"></span>Home-Based Care</button>
      <button class="es-info-btn" type="button" aria-label="About Home-Based Care" data-def-key="home_cc"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/><rect x="7.3" y="6.8" width="1.4" height="5.4" rx="0.6" fill="currentColor"/></svg></button>
    </span>
    <span class="es-legend-cell">
      <button class="es-legend-item" data-key="private_cc" style="--c: #9B2335"><span class="es-rule"></span>Private Care</button>
      <button class="es-info-btn" type="button" aria-label="About Private Care" data-def-key="private_cc"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/><rect x="7.3" y="6.8" width="1.4" height="5.4" rx="0.6" fill="currentColor"/></svg></button>
    </span>
  </div>

  <div class="es-def-popover" id="es-def-popover" role="tooltip" hidden></div>

  <div class="es-svg-box">
    <svg id="es-svg" viewBox="0 0 680 380" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div class="es-tip" id="es-tip"></div>
  </div>

  <div class="es-readout" id="es-readout" aria-live="polite">
    <div class="es-readout-placeholder">Tap a point to see its value</div>
  </div>
</div>

<script>
const series = [
  { key: "any_cc2", label: "Any Childcare", color: "#6F6F73", points: [
    {t:-9,coef:-0.00124,lo:-0.00709,hi:0.00462},{t:-8,coef:0.00376,lo:-0.00476,hi:0.01227},
    {t:-7,coef:0.00386,lo:-0.00654,hi:0.01426},{t:-6,coef:-0.0008,lo:-0.00934,hi:0.00773},
    {t:-5,coef:-0.00076,lo:-0.00836,hi:0.00685},{t:-4,coef:-0.00054,lo:-0.007,hi:0.00592},
    {t:-3,coef:-0.00378,lo:-0.01049,hi:0.00293},{t:-2,coef:-0.000005,lo:-0.00433,hi:0.00432},
    {t:-1,coef:0,lo:0,hi:0},{t:0,coef:-0.00228,lo:-0.00727,hi:0.00271},
    {t:1,coef:-0.00401,lo:-0.0096,hi:0.00158},{t:2,coef:-0.001,lo:-0.00773,hi:0.00574},
    {t:3,coef:-0.00441,lo:-0.01114,hi:0.00232},{t:4,coef:-0.00667,lo:-0.01521,hi:0.00188},
    {t:5,coef:-0.00532,lo:-0.01294,hi:0.0023},{t:6,coef:-0.01268,lo:-0.01928,hi:-0.00608},
    {t:7,coef:-0.00663,lo:-0.01458,hi:0.00133}
  ]},
  { key: "center_cc", label: "Center-Based Care", color: "#00356B", points: [
    {t:-9,coef:-0.00381,lo:-0.00853,hi:0.0009},{t:-8,coef:0.00033,lo:-0.00597,hi:0.00663},
    {t:-7,coef:0.00116,lo:-0.00649,hi:0.00882},{t:-6,coef:0.0003,lo:-0.00552,hi:0.00613},
    {t:-5,coef:-0.00028,lo:-0.00641,hi:0.00586},{t:-4,coef:-0.00204,lo:-0.0084,hi:0.00432},
    {t:-3,coef:-0.00244,lo:-0.00927,hi:0.00438},{t:-2,coef:-0.0015,lo:-0.00629,hi:0.0033},
    {t:-1,coef:0,lo:0,hi:0},{t:0,coef:-0.00483,lo:-0.00851,hi:-0.00116},
    {t:1,coef:-0.0074,lo:-0.01327,hi:-0.00152},{t:2,coef:-0.0059,lo:-0.01182,hi:0.00002},
    {t:3,coef:-0.01053,lo:-0.0184,hi:-0.00266},{t:4,coef:-0.00856,lo:-0.01499,hi:-0.00212},
    {t:5,coef:-0.00837,lo:-0.01351,hi:-0.00323},{t:6,coef:-0.01209,lo:-0.01895,hi:-0.00523},
    {t:7,coef:-0.00869,lo:-0.01506,hi:-0.00231}
  ]},
  { key: "home_cc", label: "Home-Based Care", color: "#B58A2E", points: [
    {t:-9,coef:0.00373,lo:0.00078,hi:0.00667},{t:-8,coef:0.00242,lo:-0.00074,hi:0.00559},
    {t:-7,coef:0.00375,lo:0.00049,hi:0.00702},{t:-6,coef:0.00154,lo:-0.00302,hi:0.00609},
    {t:-5,coef:0.00148,lo:-0.002,hi:0.00495},{t:-4,coef:0.00197,lo:0.0002,hi:0.00375},
    {t:-3,coef:0.00155,lo:-0.00109,hi:0.00418},{t:-2,coef:0.00255,lo:-0.00078,hi:0.00587},
    {t:-1,coef:0,lo:0,hi:0},{t:0,coef:0.00202,lo:-0.00216,hi:0.0062},
    {t:1,coef:0.00123,lo:-0.00206,hi:0.00451},{t:2,coef:0.00374,lo:0.00008,hi:0.0074},
    {t:3,coef:0.00654,lo:0.00241,hi:0.01068},{t:4,coef:0.00234,lo:-0.00286,hi:0.00753},
    {t:5,coef:0.00092,lo:-0.00359,hi:0.00543},{t:6,coef:-0.00134,lo:-0.00597,hi:0.00329},
    {t:7,coef:0.00176,lo:-0.00113,hi:0.00465}
  ]},
  { key: "private_cc", label: "Private Care", color: "#9B2335", points: [
    {t:-9,coef:-0.00115,lo:-0.00313,hi:0.00082},{t:-8,coef:0.001,lo:-0.00272,hi:0.00472},
    {t:-7,coef:-0.00106,lo:-0.00408,hi:0.00197},{t:-6,coef:-0.00264,lo:-0.00584,hi:0.00056},
    {t:-5,coef:-0.00196,lo:-0.00564,hi:0.00173},{t:-4,coef:-0.00048,lo:-0.00296,hi:0.002},
    {t:-3,coef:-0.00288,lo:-0.00512,hi:-0.00065},{t:-2,coef:-0.00105,lo:-0.00232,hi:0.00021},
    {t:-1,coef:0,lo:0,hi:0},{t:0,coef:0.00053,lo:-0.00254,hi:0.0036},
    {t:1,coef:0.00216,lo:-0.00144,hi:0.00577},{t:2,coef:0.00117,lo:-0.00293,hi:0.00527},
    {t:3,coef:-0.00043,lo:-0.00386,hi:0.00301},{t:4,coef:-0.00045,lo:-0.00435,hi:0.00346},
    {t:5,coef:0.00213,lo:-0.00121,hi:0.00546},{t:6,coef:0.00075,lo:-0.00219,hi:0.00369},
    {t:7,coef:0.0003,lo:-0.00321,hi:0.0038}
  ]}
];

const W = 680, H = 380;
const M = {top: 18, right: 24, bottom: 50, left: 58};
const PW = W - M.left - M.right;
const PH = H - M.top - M.bottom;
const xMin = -9, xMax = 7;
const yMin = -0.022, yMax = 0.018;

const xs = t => M.left + ((t - xMin) / (xMax - xMin)) * PW;
const ys = v => M.top + (1 - (v - yMin) / (yMax - yMin)) * PH;

let active = "center_cc";

const svg = document.getElementById("es-svg");
const tip = document.getElementById("es-tip");
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function tipTimeLabel(t) {
  if (t === 0) return "at inauguration";
  if (t === -9) return "9 or more months before inauguration";
  const abs = Math.abs(t);
  const word = abs === 1 ? "month" : "months";
  return t > 0
    ? `${abs} ${word} after inauguration`
    : `${abs} ${word} before inauguration`;
}

function tipFmt(v) {
  return (v * 100).toFixed(2).replace(/^-/, "\u2212");
}

const readoutEl = document.getElementById("es-readout");
function updateReadout(s, p) {
  if (!readoutEl) return;
  readoutEl.style.setProperty("--readout-color", s.color);
  readoutEl.innerHTML =
    `<div class="es-readout-title">${s.label} \u00b7 ${tipTimeLabel(p.t)}</div>` +
    `<div class="es-readout-value">${tipFmt(p.coef)} pp (95% CI: ${tipFmt(p.lo)} to ${tipFmt(p.hi)})</div>`;
}

function render() {
  svg.innerHTML = "";

  svg.appendChild(el("line", {
    x1: M.left, x2: M.left + PW, y1: ys(0), y2: ys(0),
    stroke: "#cbd5e1", "stroke-width": 1
  }));

  const yTicks = [-0.02, -0.015, -0.01, -0.005, 0, 0.005, 0.01, 0.015];
  for (const yt of yTicks) {
    svg.appendChild(el("text", {
      x: M.left - 8, y: ys(yt) + 4, "text-anchor": "end",
      style: "font: 11px 'Source Sans 3', sans-serif; fill: #64748b; font-variant-numeric: tabular-nums;"
    }, (yt * 100).toFixed(1)));
  }

  const eventX = (xs(-1) + xs(0)) / 2;
  svg.appendChild(el("line", {
    x1: eventX, x2: eventX, y1: M.top, y2: M.top + PH,
    stroke: "#64748b", "stroke-width": 1, "stroke-dasharray": "4,3", opacity: 0.55
  }));
  svg.appendChild(el("text", {
    x: eventX + 5, y: M.top + 11,
    style: "font: 500 11px 'Source Sans 3', sans-serif; fill: #475569;"
  }, "Trump inauguration"));

  for (let t = xMin; t <= xMax; t++) {
    svg.appendChild(el("line", {
      x1: xs(t), x2: xs(t), y1: M.top + PH, y2: M.top + PH + 4,
      stroke: "#94a3b8", "stroke-width": 0.5, opacity: 0.7
    }));
  }
  const xLabels = [{v:-9,t:"≤-9"},{v:-6,t:"-6"},{v:-3,t:"-3"},{v:-1,t:"-1"},{v:0,t:"0"},{v:3,t:"3"},{v:6,t:"6"}];
  for (const xl of xLabels) {
    svg.appendChild(el("text", {
      x: xs(xl.v), y: M.top + PH + 18, "text-anchor": "middle",
      style: "font: 11px 'Source Sans 3', sans-serif; fill: #64748b; font-variant-numeric: tabular-nums;"
    }, xl.t));
  }
  svg.appendChild(el("text", {
    x: M.left + PW / 2, y: M.top + PH + 40, "text-anchor": "middle",
    style: "font: 12px 'Source Sans 3', sans-serif; fill: #475569;"
  }, "Months relative to Trump's inauguration"));
  svg.appendChild(el("text", {
    x: 12, y: M.top + PH / 2,
    style: "font: 12px 'Source Sans 3', sans-serif; fill: #475569;",
    transform: `rotate(-90, 12, ${M.top + PH / 2})`,
    "text-anchor": "middle"
  }, "Estimated change in employment probability (percentage points)"));

  for (const s of series) {
    if (s.key !== active) continue;
    let path = "";
    for (let i = 0; i < s.points.length; i++) {
      const p = s.points[i];
      path += (i === 0 ? "M" : "L") + xs(p.t) + "," + ys(p.hi) + " ";
    }
    for (let i = s.points.length - 1; i >= 0; i--) {
      const p = s.points[i];
      path += "L" + xs(p.t) + "," + ys(p.lo) + " ";
    }
    path += "Z";
    svg.appendChild(el("path", { d: path, fill: s.color, opacity: 0.14, "pointer-events": "none" }));
  }

  for (const s of series) {
    const isActive = s.key === active;
    const op = active === null ? 0.78 : (isActive ? 1 : 0.16);
    let path = "";
    for (let i = 0; i < s.points.length; i++) {
      const p = s.points[i];
      path += (i === 0 ? "M" : "L") + xs(p.t) + "," + ys(p.coef) + " ";
    }
    svg.appendChild(el("path", {
      d: path, fill: "none", stroke: s.color,
      "stroke-width": isActive ? 2 : 1.5, opacity: op,
      "stroke-linecap": "round", "stroke-linejoin": "round",
      "pointer-events": "none"
    }));
  }

  for (const s of series) {
    const isActive = s.key === active;
    const op = active === null ? 0.78 : (isActive ? 1 : 0.16);
    for (const p of s.points) {
      if (p.t === -1) continue;
      svg.appendChild(el("circle", {
        cx: xs(p.t), cy: ys(p.coef), r: isActive ? 3.5 : 2.5,
        fill: s.color, opacity: op, "pointer-events": "none"
      }));
    }
    if (active === s.key || active === null) {
      svg.appendChild(el("circle", {
        cx: xs(-1), cy: ys(0), r: isActive ? 3.5 : 2.5,
        fill: "#ffffff", stroke: s.color, "stroke-width": 1.5, opacity: op,
        "pointer-events": "none"
      }));
    }
  }

  const guide = el("line", {
    x1: M.left, x2: M.left, y1: M.top, y2: M.top + PH,
    stroke: "#94a3b8", "stroke-width": 1, "stroke-dasharray": "3,3",
    opacity: 0, "pointer-events": "none"
  });
  svg.appendChild(guide);

  const focusDots = [];
  for (const s of series) {
    const d = el("circle", {
      cx: -10, cy: -10, r: 4.5,
      fill: "#ffffff", stroke: s.color, "stroke-width": 2,
      opacity: 0, "pointer-events": "none"
    });
    svg.appendChild(d);
    focusDots.push({ key: s.key, el: d });
  }

  const overlay = el("rect", {
    x: M.left, y: M.top, width: PW, height: PH,
    fill: "transparent",
    style: "cursor: crosshair;"
  });
  svg.appendChild(overlay);

  function clientToViewBox(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const scale = r.width / W;
    return { x: (clientX - r.left) / scale, y: (clientY - r.top) / scale };
  }

  function snapT(clientX) {
    const { x } = clientToViewBox(clientX, 0);
    const tFloat = ((x - M.left) / PW) * (xMax - xMin) + xMin;
    return Math.max(xMin, Math.min(xMax, Math.round(tFloat)));
  }

  function showAtT(t, clientX, clientY) {
    guide.setAttribute("x1", xs(t));
    guide.setAttribute("x2", xs(t));
    guide.setAttribute("opacity", 0.45);

    for (const fd of focusDots) {
      const s = series.find(ss => ss.key === fd.key);
      const p = s.points.find(pt => pt.t === t);
      const show = p && t !== -1 && (active === null || active === s.key);
      if (show) {
        fd.el.setAttribute("cx", xs(p.t));
        fd.el.setAttribute("cy", ys(p.coef));
        fd.el.setAttribute("opacity", 1);
      } else {
        fd.el.setAttribute("opacity", 0);
      }
    }

    let html = `<div class="es-tip-title">${tipTimeLabel(t)}</div>`;
    if (t === -1) {
      html += `<div class="es-tip-row" style="font-style: italic;">Reference period (estimates set to zero)</div>`;
    } else if (active === null) {
      for (const s of series) {
        const p = s.points.find(pt => pt.t === t);
        if (!p) continue;
        html += `<div class="es-tip-multi"><span class="es-tip-swatch" style="background:${s.color}"></span><span class="es-tip-name" style="color:${s.color}">${s.label}</span><span class="es-tip-num">${tipFmt(p.coef)} pp</span></div>`;
      }
    } else {
      const s = series.find(ss => ss.key === active);
      const p = s.points.find(pt => pt.t === t);
      if (p) {
        html += `<div class="es-tip-row" style="color:${s.color}; font-weight: 500;">${s.label}</div>`;
        html += `<div class="es-tip-row">${tipFmt(p.coef)} pp (95% CI: ${tipFmt(p.lo)} to ${tipFmt(p.hi)})</div>`;
      }
    }
    tip.innerHTML = html;

    const wrap = svg.parentElement;
    const wrapRect = wrap.getBoundingClientRect();
    const tipRect = tip.getBoundingClientRect();
    const tipW = tipRect.width || 220;
    const tipH = tipRect.height || 80;
    const xRelative = clientX - wrapRect.left;
    const yRelative = clientY - wrapRect.top;
    let left = xRelative + 14;
    let top = yRelative - tipH - 8;
    if (left + tipW > wrapRect.width - 8) left = xRelative - 14 - tipW;
    if (left < 8) left = 8;
    if (top < 4) top = yRelative + 16;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
    tip.style.opacity = 1;
  }

  function hideOverlay() {
    guide.setAttribute("opacity", 0);
    for (const fd of focusDots) fd.el.setAttribute("opacity", 0);
    tip.style.opacity = 0;
  }

  overlay.addEventListener("pointermove", (e) => {
    const t = snapT(e.clientX);
    showAtT(t, e.clientX, e.clientY);
  });
  overlay.addEventListener("pointerleave", hideOverlay);

  overlay.addEventListener("click", (e) => {
    const t = snapT(e.clientX);
    if (t === -1) return;
    const vb = clientToViewBox(e.clientX, e.clientY);
    let closestKey = null, closestDist = Infinity;
    for (const s of series) {
      const p = s.points.find(pt => pt.t === t);
      if (!p) continue;
      const dist = Math.abs(vb.y - ys(p.coef));
      if (dist < closestDist) { closestDist = dist; closestKey = s.key; }
    }
    if (closestKey) {
      const s = series.find(ss => ss.key === closestKey);
      const p = s.points.find(pt => pt.t === t);
      if (p) updateReadout(s, p);
      setActive(closestKey);
    }
  });
}

function setActive(key) {
  active = (active === key) ? null : key;
  document.querySelectorAll(".es-legend-item").forEach(p => {
    p.classList.toggle("active", p.dataset.key === active);
  });
  render();
}

document.querySelectorAll(".es-legend-item").forEach(pill => {
  pill.addEventListener("click", () => setActive(pill.dataset.key));
});

const defs = {
  any_cc2: { title: "Any Childcare", color: "#6F6F73", text: "All three settings combined." },
  center_cc: { title: "Center-Based Care", color: "#00356B", text: "Licensed daycare centers and preschools. These workplaces have licensing requirements, payroll reporting, and regular interaction with regulators and parents." },
  home_cc: { title: "Home-Based Care", color: "#B58A2E", text: "Self-employed caregivers operating out of their own homes. Smaller scale than centers, and somewhat insulated from public visibility." },
  private_cc: { title: "Private Care", color: "#9B2335", text: "Nannies and babysitters working in individual households. The least visible to authorities, organized through informal arrangements." }
};

const defPopover = document.getElementById("es-def-popover");
function showDef(btn) {
  const key = btn.dataset.defKey;
  const d = defs[key];
  if (!d) return;
  defPopover.style.setProperty("--def-color", d.color);
  defPopover.innerHTML = `<div class="es-def-popover-title">${d.title}</div>${d.text}`;
  defPopover.hidden = false;

  const wrap = document.querySelector(".es-wrap");
  const wrapRect = wrap.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  const popRect = defPopover.getBoundingClientRect();
  const popW = popRect.width;
  const popH = popRect.height;
  let left = btnRect.left - wrapRect.left + btnRect.width / 2 - popW / 2;
  let top = btnRect.bottom - wrapRect.top + 6;
  if (left + popW > wrapRect.width - 4) left = wrapRect.width - popW - 4;
  if (left < 4) left = 4;
  defPopover.style.left = left + "px";
  defPopover.style.top = top + "px";
}
function hideDef() {
  defPopover.hidden = true;
}

document.querySelectorAll(".es-info-btn").forEach(btn => {
  btn.addEventListener("mouseenter", () => showDef(btn));
  btn.addEventListener("mouseleave", hideDef);
  btn.addEventListener("focus", () => showDef(btn));
  btn.addEventListener("blur", hideDef);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (defPopover.hidden || defPopover.dataset.openFor !== btn.dataset.defKey) {
      showDef(btn);
      defPopover.dataset.openFor = btn.dataset.defKey;
    } else {
      hideDef();
      defPopover.dataset.openFor = "";
    }
  });
});
document.addEventListener("click", (e) => {
  if (defPopover.hidden) return;
  if (e.target.closest(".es-info-btn")) return;
  hideDef();
  defPopover.dataset.openFor = "";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !defPopover.hidden) {
    hideDef();
    defPopover.dataset.openFor = "";
  }
});

render();

function broadcastHeight() {
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "bfi-embed-height", id: "ice-childcare-employment", height: h }, "*");
  }
}
window.addEventListener("load", broadcastHeight);
window.addEventListener("resize", broadcastHeight);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(broadcastHeight);
}
new ResizeObserver(broadcastHeight).observe(document.body);
</script>
